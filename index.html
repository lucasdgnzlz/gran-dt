<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="src/index.css" />
    <title>Iniciar sesión - Gran DT</title>
  </head>
  <body>
    <main class="contenedor-inicio-sesion">
      <div class="contenedor-logo">
        <img src="/images/logo-gran-dt.png" class="logo-gran-dt" alt="Logo Gran DT" />
      </div>

      <div class="d-grid gap-2 col-6 mx-auto">
        <button id="" class="btn btn-primary boton-crear-cuenta" type="button">Crear cuenta</button>
        <button id="" class="btn btn-outline-secondary boton-ya-tengo-cuenta" type="button">
          Ya tengo cuenta
        </button>
      </div>

      <div class="contenedor-formulario-crear-cuenta" id="oculto">
        <form class="formulario-registro">
          <div class="mb-3">
            <label for="email-de-registro" class="form-label">Email</label>
            <input type="email" class="form-control registro-email" name="email" aria-describedby="emailHelp" />
            <p class="mensaje-error mensaje-error-email">-</p>
          </div>
          <div class="mb-3">
            <label for="contrasena-de-registro-uno" class="form-label">Contraseña</label>
            <input type="password" class="form-control registro-contrasena contrasena-de-registro-uno" name="contrasena-registro" />
            <p class="mensaje-error mensaje-error-contrasena mensaje-error-coincidencia-contrasenas">-</p>
          </div>
          <div class="mb-3">
            <label for="contrasena-de-registro-dos" class="form-label">Confirmar contraseña</label>
            <input type="password" class="form-control registro-contrasena-confirmacion contrasena-de-registro-dos" name="contrasena-registro-confirmacion" />
            <p class="mensaje-error mensaje-error-contrasena-confirmacion mensaje-error-coincidencia-contrasenas">-</p>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="confirmacion-noticias" />
            <label class="form-check-label" for="exampleCheck1">Deseo recibir noticias sobre Gran DT</label>
          </div>
          <button type="submit" class="btn btn-primary boton-registrarse">Registrarse</button>
        </form>
      </div>

      <div class="contenedor-formulario-inicio-de-sesion" id="oculto">
        <form>
          <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Email</label>
            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" />
            <p class="mensaje-error">-</p>
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="exampleInputPassword1" />
            <p class="mensaje-error">-</p>
          </div>
          <div class="mb-3 form-check contenedor-enlace-recupero-contrasenia">
            <a href="" class="form-check-label" for="exampleCheck1">¿Olvidaste tu contraseña?</a>
          </div>
          <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        </form>
      </div>
    </main>

    <script src="src/index.js" type="module"></script>
  </body>
</html>
